# Baut FPVCut.exe (mit libmpv und ffmpeg) und hängt das ZIP an das GitHub-Release.
# Läuft bei jedem Versions-Tag (v1.0.0-rc1, v1.0.0, …), auf Knopfdruck unter "Actions" und bei
# Pull Requests, die am Build etwas ändern (dann nur als Probe, ohne Release).
name: Windows-Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/windows-build.yml"
      - "src/fpvcut/core/paths.py"
      - "src/fpvcut/app.py"
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: libmpv holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-2*.7z" -D dl/mpv
          7z e dl/mpv/*.7z -ovendor/mpv libmpv-2.dll -r -y
          echo "libmpv: $(basename dl/mpv/*.7z) von https://github.com/shinchiro/mpv-winbuild-cmake/releases" >> dl/BUILD.txt

      - name: ffmpeg holen (neueste stabile Version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download latest -R BtbN/FFmpeg-Builds --pattern "ffmpeg-n*-latest-win64-gpl-[0-9]*.zip" -D dl/ffmpeg
          zip=$(ls dl/ffmpeg/*.zip | sort -V | tail -1)
          echo "ffmpeg: $zip"
          7z e "$zip" -ovendor/ffmpeg ffmpeg.exe ffprobe.exe -r -y
          7z e "$zip" -odl/ffmpeg-lizenz LICENSE.txt -r -y
          echo "ffmpeg: $(basename "$zip") von https://github.com/BtbN/FFmpeg-Builds/releases" >> dl/BUILD.txt

      - name: Bauen
        run: uv run --with pyinstaller pyinstaller --noconfirm packaging/fpvcut.spec

      - name: Lizenzen beilegen
        run: |
          cp -r packaging/lizenzen dist/FPVCut/lizenzen
          cp dl/ffmpeg-lizenz/LICENSE.txt dist/FPVCut/lizenzen/ffmpeg-LICENSE.txt
          if [ -f LICENSE ]; then cp LICENSE dist/FPVCut/lizenzen/FPVCut-LICENSE.txt; fi
          { echo "FPVCut ${GITHUB_REF_NAME} (${GITHUB_SHA})"; cat dl/BUILD.txt; } > dist/FPVCut/lizenzen/BUILD.txt
          cat dist/FPVCut/lizenzen/BUILD.txt

      - name: Selbsttest der .exe
        shell: pwsh
        run: |
          $p = Start-Process dist/FPVCut/FPVCut.exe -ArgumentList "--selbsttest", "$PWD/selbsttest.txt" -Wait -PassThru
          Get-Content selbsttest.txt
          exit $p.ExitCode

      - name: ZIP packen
        id: zip
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "test-$($env:GITHUB_SHA.Substring(0,7))" }
          $zip = "FPVCut-$name-windows.zip"
          Compress-Archive -Path dist/FPVCut -DestinationPath $zip
          "file=$zip" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: FPVCut-windows
          path: ${{ steps.zip.outputs.file }}

      - name: Release-Notizen aus dem CHANGELOG
        if: github.ref_type == 'tag'
        run: awk '/^## /{n++} n==1' CHANGELOG.md > release-notes.md

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: ${{ steps.zip.outputs.file }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
