<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<style>
 .bg{fill:#fcfcfb}.t{fill:#0b0b0b}.s{fill:#52514e}.grid{stroke:#e1e0d9}.gpu{fill:#2a78d6}.cpu{fill:#eb6834}.rt{stroke:#52514e}
