[project]
name = "fpvcut"
version = "1.0.0rc2"
description = "Schlanke Schnittsoftware für FPV-Videos"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "mpv>=1.0.6",
    "xxhash>=3.4",
]

[project.optional-dependencies]
# KI-Bildreinigung für analoges FPV-Bild (Modelle aus fpv-restoration); ohne diese Pakete fehlt
# nur diese Funktion. Einrichten mit ``uv sync --extra ki``.
ki = [
    "torch>=2.6",
    "einops>=0.8",
    "numpy>=2.0",
]

[project.scripts]
fpvcut = "fpvcut.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpvcut"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Eigenes Python von uv statt Microsoft-Store-Python: Store-Apps zeigen in der Windows-
# Taskleiste immer das Python-Icon, egal welches Icon die App setzt.
python-preference = "only-managed"

# PyTorch mit CUDA 12.6 (wie in fpv-restoration)
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
