[project]
name = "fpvcut"
version = "0.1.0"
description = "Schlanke Schnittsoftware für FPV-Videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "mpv>=1.0.6",
    "xxhash>=3.4",
]

[project.scripts]
fpvcut = "fpvcut.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpvcut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
