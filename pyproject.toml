[project]
name = "fpvcut"
version = "1.0.0rc1"
description = "Schlanke Schnittsoftware für FPV-Videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "mpv>=1.0.6",
    "xxhash>=3.4",
]

[project.scripts]
fpvcut = "fpvcut.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpvcut"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Eigenes Python von uv statt Microsoft-Store-Python: Store-Apps zeigen in der Windows-
# Taskleiste immer das Python-Icon, egal welches Icon die App setzt.
python-preference = "only-managed"
